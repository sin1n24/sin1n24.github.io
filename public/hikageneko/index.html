<script>
// ひかげねこ core: rules, shade computation, solver, generator.
// Works in Node (module.exports) and the browser (globalThis.HK).
(function (root) {
  'use strict';

  // 7 sun stops across the day. Shadow points away from the sun.
  // dir = shadow direction, len(h) = shadow length in cells for an object of height h.
  const STOPS = [
    { hour: 6,  dir: [1, 0],  len: h => 2 * h },
    { hour: 8,  dir: [1, 0],  len: h => h },
    { hour: 10, dir: [1, 1],  len: h => h, thick: true },
    { hour: 12, dir: [0, 1],  len: h => Math.ceil(h / 2) },
    { hour: 14, dir: [-1, 1], len: h => h, thick: true },
    { hour: 16, dir: [-1, 0], len: h => h },
    { hour: 18, dir: [-1, 0], len: h => 2 * h },
  ];
  const NT = STOPS.length;

  // Level map chars:
  //  '.' ground   '1' '2' '3' object of that height (blocks, casts shadow)
  //  '~' pond (not walkable, no shadow)   'p' parasol (always shade, walkable)
  //  'S' start    'G' goal (cat bed, always safe)
  function parse(level) {
    const rows = level.map;
    const H = rows.length, W = rows[0].length;
    const cells = [];
    let start = -1, goal = -1;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ch = rows[y][x];
        const c = { ch, h: 0, block: false, pond: false, parasol: false };
        if (ch >= '1' && ch <= '3') { c.h = +ch; c.block = true; }
        else if (ch === '~') { c.pond = true; }
        else if (ch === 'p') { c.parasol = true; }
        else if (ch === 'S') { start = y * W + x; }
        else if (ch === 'G') { goal = y * W + x; }
        cells.push(c);
      }
    }
    const b = { W, H, cells, start, goal, t0: level.t0 };
    b.shade = computeShadeAll(b);
    b.safe = computeSafeAll(b);
    return b;
  }

  function shadowCellsOf(x, y, h, stop) {
    const out = [];
    const [dx, dy] = stop.dir;
    const L = stop.len(h);
    for (let i = 1; i <= L; i++) {
      out.push([x + dx * i, y + dy * i]);
      if (stop.thick) {
        out.push([x + dx * i, y + dy * (i - 1)]);
        out.push([x + dx * (i - 1), y + dy * i]);
      }
    }
    return out;
  }

  function computeShadeAll(b) {
    const { W, H, cells } = b;
    const res = [];
    for (let t = 0; t < NT; t++) {
      const s = new Uint8Array(W * H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const c = cells[y * W + x];
        if (!c.block) continue;
        for (const [sx, sy] of shadowCellsOf(x, y, c.h, STOPS[t])) {
          if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
          s[sy * W + sx] = 1;
        }
      }
      res.push(s);
    }
    return res;
  }

  function walkable(b, i) {
    const c = b.cells[i];
    return !c.block && !c.pond;
  }

  function computeSafeAll(b) {
    const { W, H, cells } = b;
    const res = [];
    for (let t = 0; t < NT; t++) {
      const s = new Uint8Array(W * H);
      for (let i = 0; i < W * H; i++) {
        if (!walkable(b, i)) continue;
        const c = cells[i];
        if (b.shade[t][i] || c.parasol || i === b.goal) s[i] = 1;
      }
      res.push(s);
    }
    return res;
  }

  function neighbors(b, i) {
    const { W, H } = b;
    const x = i % W, y = (i / W) | 0;
    const n = [];
    if (x > 0) n.push(i - 1);
    if (x < W - 1) n.push(i + 1);
    if (y > 0) n.push(i - W);
    if (y < H - 1) n.push(i + W);
    return n;
  }

  // Cells reachable by walking from `from` at time t (shade-connected component).
  function reach(b, from, t) {
    const safe = b.safe[t];
    const prev = new Int32Array(b.W * b.H).fill(-2);
    if (!safe[from]) return prev;
    prev[from] = -1;
    const q = [from];
    for (let qi = 0; qi < q.length; qi++) {
      const i = q[qi];
      if (i === b.goal) continue; // entering the bed ends the walk
      for (const j of neighbors(b, i)) {
        if (prev[j] !== -2 || !safe[j]) continue;
        prev[j] = i;
        q.push(j);
      }
    }
    return prev;
  }

  function pathTo(prev, to) {
    if (prev[to] === -2) return null;
    const p = [];
    for (let i = to; i !== -1; i = prev[i]) p.push(i);
    return p.reverse();
  }

  // 0-1 BFS over (cell, time). Walking costs 0, one sun step costs 1.
  // Returns { cost, plan } where plan is a list of actions.
  function solve(b, from, t0) {
    const N = b.W * b.H;
    if (from === undefined) from = b.start;
    if (t0 === undefined) t0 = b.t0;
    const INF = 1e9;
    const dist = new Int32Array(N * NT).fill(INF);
    const par = new Int32Array(N * NT).fill(-1);
    const key = (i, t) => i * NT + t;
    const dq = new Int32Array(N * NT * 4);
    let head = N * NT * 2, tail = head;
    const s0 = key(from, t0);
    if (!b.safe[t0][from]) return null;
    dist[s0] = 0; dq[tail++] = s0;
    let goalKey = -1;
    while (head < tail) {
      const k = dq[head++];
      const i = (k / NT) | 0, t = k % NT, d = dist[k];
      if (i === b.goal) { goalKey = k; break; }
      // walk (cost 0)
      for (const j of neighbors(b, i)) {
        if (!b.safe[t][j]) continue;
        const kk = key(j, t);
        if (dist[kk] > d) { dist[kk] = d; par[kk] = k; dq[--head] = kk; }
      }
      // sun step (cost 1)
      for (const nt of [t - 1, t + 1]) {
        if (nt < 0 || nt >= NT || !b.safe[nt][i]) continue;
        const kk = key(i, nt);
        if (dist[kk] > d + 1) { dist[kk] = d + 1; par[kk] = k; dq[tail++] = kk; }
      }
    }
    if (goalKey < 0) return null;
    const states = [];
    for (let k = goalKey; k !== -1; k = par[k]) states.push(k);
    states.reverse();
    // Compress into actions: {type:'walk', to} and {type:'sun', t}
    const plan = [];
    for (let s = 1; s < states.length; s++) {
      const a = states[s - 1], c = states[s];
      const ai = (a / NT) | 0, at = a % NT, ci = (c / NT) | 0, ct = c % NT;
      if (at !== ct) {
        const last = plan[plan.length - 1];
        if (last && last.type === 'sun' && Math.sign(ct - at) === Math.sign(last.t - last.from)) last.t = ct;
        else plan.push({ type: 'sun', from: at, t: ct, at: ai });
      } else {
        const last = plan[plan.length - 1];
        if (last && last.type === 'walk') last.to = ci;
        else plan.push({ type: 'walk', from: ai, to: ci, t: at });
      }
    }
    return { cost: dist[goalKey], plan };
  }

  function metrics(b) {
    const r = solve(b);
    if (!r) return null;
    const suns = r.plan.filter(a => a.type === 'sun');
    let reversals = 0;
    for (let i = 1; i < suns.length; i++) {
      if (Math.sign(suns[i].t - suns[i].from) !== Math.sign(suns[i - 1].t - suns[i - 1].from)) reversals++;
    }
    const waypoints = new Set(suns.map(s => s.at)).size;
    // how much of the (cell,time) space is explorable from start
    const N = b.W * b.H;
    const seen = new Uint8Array(N * NT);
    const q = [b.start * NT + b.t0]; seen[q[0]] = 1;
    for (let qi = 0; qi < q.length; qi++) {
      const k = q[qi]; const i = (k / NT) | 0, t = k % NT;
      if (i === b.goal) continue;
      for (const j of neighbors(b, i)) if (b.safe[t][j] && !seen[j * NT + t]) { seen[j * NT + t] = 1; q.push(j * NT + t); }
      for (const nt of [t - 1, t + 1]) if (nt >= 0 && nt < NT && b.safe[nt][i] && !seen[i * NT + nt]) { seen[i * NT + nt] = 1; q.push(i * NT + nt); }
    }
    return { cost: r.cost, drags: suns.length, reversals, waypoints, space: q.length, plan: r.plan };
  }

  // ---------- seeded RNG ----------
  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s += 0x6D2B79F5;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- generator ----------
  // opts: { W, H, blocks:[min,max], hw:[w1,w2,w3], ponds:[min,max], parasols:[min,max] }
  function randomLevel(R, o) {
    const { W, H } = o;
    const g = Array.from({ length: H }, () => Array(W).fill('.'));
    const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
    const empty = () => { for (let k = 0; k < 200; k++) { const x = ri(0, W - 1), y = ri(0, H - 1); if (g[y][x] === '.') return [x, y]; } return null; };
    const nb = ri(o.blocks[0], o.blocks[1]);
    const tw = o.hw[0] + o.hw[1] + o.hw[2];
    for (let k = 0; k < nb; k++) {
      const p = empty(); if (!p) break;
      let r = R() * tw, h = 1;
      if (r >= o.hw[0]) h = r < o.hw[0] + o.hw[1] ? 2 : 3;
      g[p[1]][p[0]] = String(h);
    }
    const np = ri(o.ponds[0], o.ponds[1]);
    for (let k = 0; k < np; k++) {
      const p = empty(); if (!p) break;
      g[p[1]][p[0]] = '~';
      // ponds like to be 2 cells
      if (R() < 0.6) {
        const d = R() < 0.5 ? [1, 0] : [0, 1];
        const x2 = p[0] + d[0], y2 = p[1] + d[1];
        if (x2 < W && y2 < H && g[y2][x2] === '.') g[y2][x2] = '~';
      }
    }
    const npa = ri(o.parasols[0], o.parasols[1]);
    for (let k = 0; k < npa; k++) { const p = empty(); if (p) g[p[1]][p[0]] = 'p'; }
    // start on one side, goal far away
    const sp = o.startRows ? [ri(0, W - 1), ri(H - 2, H - 1)] : empty();
    if (!sp || g[sp[1]][sp[0]] !== '.') return null;
    g[sp[1]][sp[0]] = 'S';
    let gp = null;
    for (let k = 0; k < 60; k++) {
      const p = o.startRows ? [ri(0, W - 1), ri(0, 1)] : empty();
      if (!p || g[p[1]][p[0]] !== '.') continue;
      if (Math.abs(p[0] - sp[0]) + Math.abs(p[1] - sp[1]) >= Math.max(W, H) - 1) { gp = p; break; }
    }
    if (!gp) return null;
    g[gp[1]][gp[0]] = 'G';
    const map = g.map(r => r.join(''));
    // choose a start time where the start is shaded
    const base = parse({ map, t0: 0 });
    const ts = [];
    for (let t = 0; t < NT; t++) if (base.safe[t][base.start]) ts.push(t);
    if (!ts.length) return null;
    return { map, t0: ts[Math.floor(R() * ts.length)] };
  }

  // Remove objects that don't matter for the solution cost (keeps boards tidy).
  function prune(level, keep) {
    let map = level.map.slice();
    const base = metrics(parse({ map, t0: level.t0 }));
    if (!base) return level;
    const cells = [];
    for (let y = 0; y < map.length; y++) for (let x = 0; x < map[0].length; x++) if ('123~'.includes(map[y][x])) cells.push([x, y]);
    for (const [x, y] of cells) {
      if (keep && keep() ) continue;
      const trial = map.slice();
      trial[y] = trial[y].slice(0, x) + '.' + trial[y].slice(x + 1);
      const b = parse({ map: trial, t0: level.t0 });
      if (!b.safe[level.t0][b.start]) continue;
      const m = metrics(b);
      if (m && m.cost >= base.cost && m.reversals >= base.reversals) map = trial;
    }
    return { map, t0: level.t0 };
  }

  function score(m) {
    return m.cost + 2 * m.reversals + m.waypoints;
  }

  function generate(seed, o, want) {
    const R = rng(seed);
    let best = null, bestS = -1;
    for (let k = 0; k < (o.tries || 300); k++) {
      const lv = randomLevel(R, o);
      if (!lv) continue;
      const b = parse(lv);
      const m = metrics(b);
      if (!m || m.cost < want.min) continue;
      const s = score(m);
      if (want.max && s > want.max) continue;
      if (s > bestS) { best = lv; bestS = s; }
      if (want.enough && s >= want.enough) break;
    }
    if (!best) return null;
    if (o.prune !== false) best = prune(best);
    return best;
  }


  function nobj(map) { return map.join('').replace(/[.SG]/g, '').length; }
  function setc(map, x, y, ch) { const m = map.slice(); m[y] = m[y].slice(0, x) + ch + m[y].slice(x + 1); return m; }

  // add decoys that keep the solution at least as hard
  function decorate(lv, R, target, chars) {
    let map = lv.map.slice();
    const base = metrics(parse(lv));
    const H = map.length, W = map[0].length;
    for (let k = 0; k < 400 && nobj(map) < target; k++) {
      const x = Math.floor(R() * W), y = Math.floor(R() * H);
      if (map[y][x] !== '.') continue;
      const ch = chars[Math.floor(R() * chars.length)];
      const trial = setc(map, x, y, ch);
      const b = parse({ map: trial, t0: lv.t0 });
      if (!b.safe[lv.t0][b.start]) continue;
      const m = metrics(b);
      if (!m || m.cost < base.cost || m.reversals < base.reversals || m.cost > base.cost + 2) continue;
      map = trial;
    }
    return { map, t0: lv.t0 };
  }

  // Search for a level matching a difficulty spec. Deterministic for a given seed.
  function findLevel(spec, seed, maxIter) {
    const R = rng(seed);
    const o = { W: spec.W, H: spec.H, blocks: spec.blocks, hw: spec.hw || [3, 3, 2], ponds: spec.ponds || [0, 0], parasols: spec.parasols || [0, 0], startRows: true };
    const drags = spec.drags || [0, 99];
    for (let k = 0; k < (maxIter || 400000); k++) {
      let lv = randomLevel(R, o); if (!lv) continue;
      const m0 = metrics(parse(lv)); if (!m0 || m0.cost < spec.cost[0]) continue;
      lv = prune(lv);
      if (spec.need) { const s = lv.map.join(''); if (spec.need.some(ch => !s.includes(ch))) continue; }
      lv = decorate(lv, R, spec.decor || 0, spec.decorChars || '123');
      const m = metrics(parse(lv)); if (!m) continue;
      if (m.cost < spec.cost[0] || m.cost > spec.cost[1]) continue;
      if (m.drags < drags[0] || m.drags > drags[1]) continue;
      if (m.reversals < (spec.rev || 0)) continue;
      return { lv, m };
    }
    return null;
  }

  const HK = { STOPS, NT, parse, reach, pathTo, solve, metrics, rng, randomLevel, prune, score, generate, neighbors, shadowCellsOf, decorate, findLevel };
  if (typeof module !== 'undefined' && module.exports) module.exports = HK;
  else root.HK = HK;
})(typeof globalThis !== 'undefined' ? globalThis : this);

        c.fillStyle = '#fff'; ell(c, px + s * 0.011, ey - s * 0.017, s * 0.012, s * 0.012); c.fill();
      }
    }
    // nose & mouth
    const nx = hx + f * s * 0.02, ny = hy + s * 0.058;
    c.beginPath(); c.moveTo(nx - s * 0.018, ny - s * 0.01); c.lineTo(nx + s * 0.018, ny - s * 0.01); c.lineTo(nx, ny + s * 0.01); c.closePath(); c.fillStyle = PK === '#FFFFFF' ? '#FF9DA8' : PK; c.fill();
    c.lineWidth = lw * 0.85;
    if (o.mood === 'hot') { c.beginPath(); c.moveTo(nx - s * 0.04, ny + s * 0.045); for (let k = 1; k <= 4; k++) c.lineTo(nx - s * 0.04 + k * s * 0.02, ny + s * (k % 2 ? 0.03 : 0.045)); c.stroke(); }
    else { c.beginPath(); c.arc(nx - s * 0.018, ny + s * 0.012, s * 0.018, 0.1 * Math.PI, 0.9 * Math.PI); c.arc(nx + s * 0.018, ny + s * 0.012, s * 0.018, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke(); }
    // cheeks & whiskers
    c.save(); c.fillStyle = '#FF9DA8'; c.globalAlpha *= o.mood === 'happy' ? 0.85 : 0.55;
    for (const d of [-1, 1]) { ell(c, hx + d * s * 0.16, hy + s * 0.07, s * 0.043, s * 0.027); c.fill(); }
    c.restore();
    c.save(); c.globalAlpha *= 0.55; c.lineWidth = lw * 0.7;
    for (const d of [-1, 1]) { for (const w of [-0.015, 0.03]) { c.beginPath(); c.moveTo(hx + d * s * 0.2, hy + s * 0.06); c.lineTo(hx + d * s * 0.32, hy + s * (0.045 + w)); c.stroke(); } }
    c.restore();
    c.strokeStyle = INK;
    drawOutfit(c, look.outfit, hx, hy, s, f, lw, ex, ey);
    if (o.mood === 'hot') {
      c.fillStyle = '#8FD3F5'; c.lineWidth = lw * 0.8;
      for (const [dx, dy] of [[0.27, -0.62], [-0.3, -0.55]]) { c.beginPath(); const px = hx + dx * s, py = dy * s; c.moveTo(px, py - s * 0.06); c.quadraticCurveTo(px + s * 0.045, py, px, py + s * 0.02); c.quadraticCurveTo(px - s * 0.045, py, px, py - s * 0.06); c.fill(); c.stroke(); }
    }
    c.restore();
  }

  function drawOutfit(c, id, hx, hy, s, f, lw, ex, ey) {
    if (!id || id === 'none') return;
    c.save(); c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round';
    if (id === 'ribbon') {
      const x0 = hx + s * 0.15, y0 = hy - s * 0.19;
      for (const d of [-1, 1]) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + d * s * 0.1, y0 - s * 0.065); c.lineTo(x0 + d * s * 0.1, y0 + s * 0.065); c.closePath(); fs(c, '#FF7A9C'); }
      ell(c, x0, y0, s * 0.032, s * 0.032); fs(c, '#FF5C86');
    } else if (id === 'bell') {
      ell(c, hx * 0.6, hy + s * 0.2, s * 0.15, s * 0.035); fs(c, '#EE5A4A');
      ell(c, hx * 0.6 + f * s * 0.01, hy + s * 0.245, s * 0.045, s * 0.045); fs(c, '#FFCB47');
      c.beginPath(); c.moveTo(hx * 0.6 - s * 0.018, hy + s * 0.255); c.lineTo(hx * 0.6 + s * 0.028, hy + s * 0.255); c.stroke();
    } else if (id === 'bandana') {
      c.beginPath(); c.moveTo(hx * 0.6 - s * 0.17, hy + s * 0.18); c.lineTo(hx * 0.6 + s * 0.17, hy + s * 0.18); c.lineTo(hx * 0.6 + f * s * 0.03, hy + s * 0.34); c.closePath(); fs(c, '#6EB5E0');
      c.fillStyle = '#FFFFFF'; for (const [dx, dy] of [[-0.08, 0.22], [0.07, 0.22], [0.0, 0.28]]) { ell(c, hx * 0.6 + dx * s, hy + dy * s, s * 0.016, s * 0.016); c.fill(); }
    } else if (id === 'flower') {
      const cols = ['#FF9CB5', '#FFD166', '#FFFFFF', '#B8A6F2', '#FF9CB5'];
      for (let k = 0; k < 5; k++) {
        const a = Math.PI * (1.12 + k * 0.19), px = hx + s * 0.23 * Math.cos(a), py = hy + s * 0.19 * Math.sin(a);
        c.fillStyle = cols[k];
        for (let q = 0; q < 5; q++) { const b = q * 1.2566; ell(c, px + Math.cos(b) * s * 0.028, py + Math.sin(b) * s * 0.028, s * 0.025, s * 0.025); c.fill(); }
        c.fillStyle = '#FFB547'; ell(c, px, py, s * 0.018, s * 0.018); c.fill();
      }
    } else if (id === 'straw') {
      ell(c, hx, hy - s * 0.15, s * 0.32, s * 0.075); fs(c, '#F2D48A');
      const crown = () => { c.beginPath(); c.moveTo(hx - s * 0.16, hy - s * 0.16); c.bezierCurveTo(hx - s * 0.17, hy - s * 0.4, hx + s * 0.17, hy - s * 0.4, hx + s * 0.16, hy - s * 0.16); c.closePath(); };
      crown(); fs(c, '#F6DC98');
      c.save(); crown(); c.clip(); c.fillStyle = '#E4574B'; c.fillRect(hx - s * 0.2, hy - s * 0.225, s * 0.4, s * 0.055); c.restore();
      crown(); c.stroke();
    } else if (id === 'glasses') {
      c.fillStyle = '#3B3340';
      for (const d of [-1, 1]) { const px = hx + d * ex + f * s * 0.015; rr(c, px - s * 0.065, ey - s * 0.045, s * 0.13, s * 0.085, s * 0.035); c.fill(); }
      c.lineWidth = lw * 0.9; c.beginPath(); c.moveTo(hx - ex + s * 0.06, ey - s * 0.02); c.lineTo(hx + ex - s * 0.04, ey - s * 0.02); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.55)'; for (const d of [-1, 1]) { const px = hx + d * ex + f * s * 0.015; rr(c, px - s * 0.045, ey - s * 0.032, s * 0.035, s * 0.015, 2); c.fill(); }
    } else if (id === 'beret') {
      c.translate(hx - f * s * 0.04, hy - s * 0.19); c.rotate(-f * 0.25);
      ell(c, 0, 0, s * 0.21, s * 0.08); fs(c, '#E4574B');
      rr(c, -s * 0.012, -s * 0.12, s * 0.024, s * 0.05, 2); fs(c, '#C9443A');
    } else if (id === 'crown') {
      const b = hy - s * 0.17;
      c.beginPath(); c.moveTo(hx - s * 0.13, b); c.lineTo(hx - s * 0.13, b - s * 0.1); c.lineTo(hx - s * 0.065, b - s * 0.045); c.lineTo(hx, b - s * 0.13); c.lineTo(hx + s * 0.065, b - s * 0.045); c.lineTo(hx + s * 0.13, b - s * 0.1); c.lineTo(hx + s * 0.13, b); c.closePath(); fs(c, '#FFCB47');
      c.fillStyle = '#EE5A4A'; for (const dx of [-0.13, 0, 0.13]) { ell(c, hx + dx * s, b - s * (dx ? 0.1 : 0.13), s * 0.02, s * 0.02); c.fill(); }
    }
    c.restore();
  }

  // ------------------------------------------------------------------ sun
  function drawSun(c, x, y, r, t, tau, mood, ghost) {
    const w = warmth(tau);
    c.save();
    if (ghost) c.globalAlpha = 0.45;
    c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = 2;
    const rayCol = mix('#FFD24D', '#FFA24D', w);
    for (let k = 0; k < 10; k++) {
      const a = k * Math.PI / 5 + t * 0.35;
      const r1 = r * 1.16, r2 = r * (1.5 + 0.06 * Math.sin(t * 3 + k));
      c.beginPath();
      c.moveTo(x + Math.cos(a - 0.2) * r1, y + Math.sin(a - 0.2) * r1);
      c.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
      c.lineTo(x + Math.cos(a + 0.2) * r1, y + Math.sin(a + 0.2) * r1);
      c.closePath(); c.fillStyle = rayCol; c.fill(); c.stroke();
    }
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, mix('#FFF3A8', '#FFE0A0', w)); g.addColorStop(1, mix('#FFC53D', '#FF9A4A', w));
    ell(c, x, y, r, r); c.fillStyle = g; c.fill(); c.lineWidth = 2.5; c.stroke();
    c.lineWidth = 2; c.lineCap = 'round';
    const noon = Math.abs(tau - 3) < 0.25 && mood !== 'ouch';
    if (mood === 'ouch') {
      for (const d of [-1, 1]) { const ex = x + d * r * 0.34, ey = y - r * 0.08; c.beginPath(); c.moveTo(ex - d * r * 0.12, ey - r * 0.12); c.lineTo(ex + d * r * 0.05, ey); c.lineTo(ex - d * r * 0.12, ey + r * 0.12); c.stroke(); }
      c.beginPath(); c.ellipse(x, y + r * 0.35, r * 0.12, r * 0.09, 0, 0, Math.PI * 2); c.fillStyle = INK; c.fill();
    } else if (noon) {
      c.fillStyle = '#4A3B34';
      for (const d of [-1, 1]) { rr(c, x + d * r * 0.36 - r * 0.25, y - r * 0.2, r * 0.5, r * 0.32, r * 0.14); c.fill(); }
      c.beginPath(); c.moveTo(x - r * 0.12, y - r * 0.12); c.lineTo(x + r * 0.12, y - r * 0.12); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.5)'; for (const d of [-1, 1]) { rr(c, x + d * r * 0.36 - r * 0.16, y - r * 0.15, r * 0.12, r * 0.06, 2); c.fill(); }
      c.beginPath(); c.arc(x, y + r * 0.22, r * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    } else {
      for (const d of [-1, 1]) { c.beginPath(); c.arc(x + d * r * 0.34, y - r * 0.02, r * 0.13, 1.1 * Math.PI, 1.9 * Math.PI); c.stroke(); }
      c.beginPath(); c.arc(x, y + r * 0.18, r * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    }
    c.fillStyle = 'rgba(255,120,110,.45)'; for (const d of [-1, 1]) { ell(c, x + d * r * 0.58, y + r * 0.2, r * 0.16, r * 0.1); c.fill(); }
    c.restore();
  }

  // ------------------------------------------------------------------ layout
  function stopAngle(tau) { const a0 = 164 * Math.PI / 180, a1 = 16 * Math.PI / 180; return a0 - (a0 - a1) * tau / (NT - 1); }
  function sunPos(tau) { const a = stopAngle(tau); return [L.cx + L.Rx * Math.cos(a), L.cy - L.Ry * Math.sin(a)]; }
  function pointerToTau(px, py) {
    const a0 = 164 * Math.PI / 180, a1 = 16 * Math.PI / 180;
    let a = Math.atan2((L.cy - py) / L.Ry, (px - L.cx) / L.Rx);
    if (a < 0) a = px < L.cx ? Math.PI : 0;
    a = clamp(a, a1 - 0.25, a0 + 0.25);
    return (a0 - a) / (a0 - a1) * (NT - 1);
  }

  function computeLayout() {
    const w = cv.clientWidth, h = cv.clientHeight;
    const b = S.b;
    let topR, botR, skyH;
    const tipEl = $('#tip');
    const tipH = (S.mode === 'play' && !tipEl.hidden) ? tipEl.offsetHeight + 12 : 0;
    if (S.mode === 'play') { topR = 62; botR = 80 + tipH; skyH = clamp(h * 0.17, 96, 150); }
    else if (S.mode === 'title') { topR = 0; botR = 180; skyH = clamp(h * 0.38, 220, 330); }
    else { topR = 0; botR = h * 0.72; skyH = clamp(h * 0.22, 130, 210); }
    const horizonY = topR + skyH;
    const availW = w - 32;
    const availH = Math.max(60, h - horizonY - botR - 10);
    const s = Math.max(12, Math.min(availW / b.W, availH / (b.H + 1.0), 64));
    const bw = s * b.W, bh = s * b.H;
    const bx = Math.round((w - bw) / 2);
    const extra = Math.max(0, availH - (b.H + 1.0) * s);
    const by = Math.round(horizonY + 0.72 * s + extra * 0.4);
    const sunR = clamp(skyH * 0.14, 15, 23);
    const cx = w / 2, cy = horizonY - 2;
    const Rx = Math.min(w / 2 - sunR - (S.mode === 'title' ? 6 : 16), 230);
    const Ry = Math.max(36, cy - topR - sunR * 1.5 - 6);
    L = { w, h, topR, botR, skyH, horizonY, s, bx, by, bw, bh, sunR, cx, cy, Rx, Ry, depth: Math.max(6, s * 0.18), tipH };
    // offscreen shade canvas
    const sw = Math.ceil(bw * DPR), sh = Math.ceil(bh * DPR);
    if (shadeCv.width !== sw || shadeCv.height !== sh) { shadeCv.width = sw; shadeCv.height = sh; }
    buildScenery();
    if (S.mode === 'title') {
      const logo = $('#titleLogo');
      const lw = Math.max(logo.querySelector('.logo').offsetWidth, logo.querySelector('.tagline').offsetWidth * 0.8);
      const cosA = Math.min(0.97, (lw / 2 + sunR * 1.6) / Rx);
      const arcY = cy - Ry * Math.sqrt(1 - cosA * cosA);
      logo.style.top = Math.round(Math.min(arcY + sunR * 1.2, cy - logo.offsetHeight - 30)) + 'px';
    }
    if (S.mode === 'play' && !tipEl.hidden) tipEl.style.bottom = (84) + 'px';
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(cv.clientWidth * DPR);
    cv.height = Math.round(cv.clientHeight * DPR);
    if (S.b) computeLayout();
  }

  // skyline, clouds, far-ground decoration
  function buildScenery() {
    const R = HK.rng(hash(S.themeKey.length, Math.round(L.w), 7));
    const sky = { items: [], far: [] };
    const key = S.themeKey;
    let x = -10;
    if (key === 'town') {
      while (x < L.w + 20) { const w = 18 + R() * 30, h = 12 + R() * 26; sky.items.push({ x, w, h, roof: R() < 0.55, col: R() < 0.5 ? 0 : 1, win: R() }); x += w + R() * 4; }
    } else if (key === 'park') {
      while (x < L.w + 30) { const r = 12 + R() * 16; sky.items.push({ x, r, col: R() < 0.5 ? 0 : 1 }); x += r * 1.3; }
    } else {
      sky.items.push({ boat: L.w * (0.18 + R() * 0.6) });
    }
    const n = Math.round(L.w / 40);
    for (let k = 0; k < n * 3; k++) sky.far.push({ x: R() * L.w, y: L.horizonY + 6 + R() * (L.h - L.horizonY), k: R() });
    S.sky = sky;
    if (!S.clouds.length) for (let k = 0; k < 4; k++) S.clouds.push({ x: R() * 1.2, y: 0.15 + R() * 0.5, s: 0.7 + R() * 0.6, v: 0.004 + R() * 0.006 });
  }

  // ------------------------------------------------------------------ level setup
  function dateKey(d) { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
  const dailyCache = {};
  function makeDaily(key) {
    if (dailyCache[key]) return dailyCache[key];
    const [y, m, d] = key.split('-').map(Number);
    const dayNum = Math.floor(Date.UTC(y, m - 1, d) / 86400000);
    const theme = ['town', 'park', 'beach'][dayNum % 3];
    const seed = y * 10000 + m * 100 + d;
    let r = HK.findLevel(DAILY_SPECS[theme], seed, 60000);
    if (!r) r = HK.findLevel(Object.assign({}, DAILY_SPECS[theme], { rev: 1, cost: [6, 12], drags: [3, 9] }), seed + 1, 120000);
    const lv = r ? { map: r.lv.map, t0: r.lv.t0, par: r.m.cost } : LEVELS[16];
    return (dailyCache[key] = { lv, theme: r ? theme : 'park', label: `${m}/${d}` });
  }

  function setupBoard(lv, themeKey, seedK) {
    S.lv = lv;
    S.b = HK.parse(lv);
    S.themeKey = themeKey;
    S.theme = THEMES[themeKey];
    const b = S.b, th = S.theme;
    S.sprites = b.cells.map((c, i) => {
      if (!c.block) return null;
      const list = th['h' + c.h];
      const v = hash(i % b.W, (i / b.W) | 0, seedK);
      return { kind: list[v % list.length], v: (v >>> 5) % 7 };
    });
    // ground decoration
    const R = HK.rng(seedK * 31 + 7);
    S.decor = [];
    for (let i = 0; i < b.W * b.H; i++) {
      const c = b.cells[i];
      if (c.block || c.pond || i === b.goal) continue;
      if (R() < 0.45) S.decor.push({ i, dx: 0.2 + R() * 0.6, dy: 0.2 + R() * 0.6, k: Math.floor(R() * 4), r: R() });
    }
    S.t = lv.t0; S.tau = lv.t0; S.tauDrag = null; S.drag = null;
    const p = cellXY(b.start);
    S.cat = { cell: b.start, x: p[0], y: p[1], face: 1, path: null, walk: 0, mood: 'idle', moodT: 0, blinkT: 2, hop: 0, scale: 1 };
    S.steps = 0; S.undo = []; S.history = [lv.t0];
    S.won = false; S.winT = 0; S.hint = null;
    S.par = lv.par !== undefined ? lv.par : HK.solve(b).cost;
    S.shadeA = new Float32Array(b.W * b.H);
    S.reachA = new Float32Array(b.W * b.H);
    for (let i = 0; i < b.W * b.H; i++) S.shadeA[i] = b.shade[S.t][i];
    S.particles = []; S.bubble = null; S.flash = null; S.ouchT = 0; S.sunOuch = 0;
    S.medalCell = lv.medal === undefined ? -1 : lv.medal;
    S.medalFound = S.lvIndex >= 0 && !!save.medals.hidden[S.lvIndex];
    S.glint = null; S.glintT = 3 + Math.random() * 3;
    updateReach();
    for (let i = 0; i < b.W * b.H; i++) S.reachA[i] = S.reach[i] ? 1 : 0;
  }
  function cellXY(i) { return [i % S.b.W, (i / S.b.W) | 0]; }
  function updateReach() {
    const b = S.b;
    const prev = HK.reach(b, S.cat.cell, S.t);
    S.reach = new Uint8Array(b.W * b.H);
    for (let i = 0; i < b.W * b.H; i++) S.reach[i] = prev[i] !== -2 ? 1 : 0;
    S.reachPrev = prev;
  }
  function allowedRange() {
    const i = S.cat.cell;
    let lo = S.t, hi = S.t;
    while (lo > 0 && S.b.safe[lo - 1][i]) lo--;
    while (hi < NT - 1 && S.b.safe[hi + 1][i]) hi++;
    return [lo, hi];
  }

  // ------------------------------------------------------------------ actions
  function snapshot() { return { cell: S.cat.cell, t: S.t, steps: S.steps, hist: S.history.slice() }; }
  function stepTime(dir, silent) {
    S.t += dir;
    S.steps += 1;
    if (!silent) Sfx.note(S.t);
    updateReach();
    S.hint = null;
    updateHud();
  }
  function say(text, dur) { S.bubble = { text, life: 0, max: dur || 1.3 }; }
  function ouch(badStop) {
    S.cat.mood = 'hot'; S.cat.moodT = 0.8; S.cat.hop = 1;
    S.ouchStop = badStop; S.ouchT = 0.9; S.sunOuch = 0.6;
    say('アチッ！', 1.1);
    Sfx.ouch();
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) { /* ignore */ } }
    const [cx, cy] = catScreen();
    for (let k = 0; k < 6; k++) S.particles.push({ type: 'puff', x: cx + (Math.random() - 0.5) * L.s * 0.5, y: cy - L.s * 0.2, vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 40, life: 0, max: 0.6, size: L.s * 0.08 });
  }
  function startWalk(path) {
    S.undo.push(snapshot());
    S.cat.path = path.slice(1);
    if (S.mode === 'play') Sfx.walk(path.length - 1);
    S.hint = null;
    dismissTip('walk');
  }
  function doUndo() {
    if (S.mode !== 'play' || S.cat.path || S.won || S.drag || !S.undo.length) return;
    const sn = S.undo.pop();
    S.cat.cell = sn.cell; const p = cellXY(sn.cell); S.cat.x = p[0]; S.cat.y = p[1];
    S.t = sn.t; S.steps = sn.steps; S.history = sn.hist;
    S.hint = null; updateReach(); updateHud(); Sfx.undo();
  }
  function doReset() {
    if (S.mode !== 'play' || S.drag) return;
    if (S.won) return;
    setupBoard(S.lv, S.themeKey, S.seedK);
    updateHud(); Sfx.reset();
  }
  function doHint() {
    if (S.mode !== 'play' || S.won || S.cat.path) return;
    const r = HK.solve(S.b, S.cat.cell, S.t);
    if (!r || !r.plan.length) return;
    const a = r.plan[0];
    if (a.type === 'walk') S.hint = { type: 'walk', cell: a.to, t0: S.time };
    else S.hint = { type: 'sun', t: a.from + Math.sign(a.t - a.from), final: a.t, t0: S.time };
    Sfx.hint();
  }
  function keySun(dir) {
    if (S.mode !== 'play' || S.won || S.cat.path || S.drag) return;
    const nt = S.t + dir;
    if (nt < 0 || nt >= NT) return;
    if (!S.b.safe[nt][S.cat.cell]) { ouch(nt); return; }
    S.undo.push(snapshot());
    stepTime(dir);
    S.history.push(S.t);
    dismissTip('sun');
  }
  function tapCell(i) {
    const b = S.b, c = b.cells[i];
    if (i === S.cat.cell) { say('にゃ？', 0.9); Sfx.meow(); S.particles.push({ type: 'heart', x: catScreen()[0], y: catScreen()[1] - L.s * 0.8, vx: 0, vy: -30, life: 0, max: 0.9, size: L.s * 0.12 }); return; }
    if (c.block) {
      const adj = HK.neighbors(b, S.cat.cell).includes(i);
      const dx = (i % b.W) - (S.cat.cell % b.W); if (dx) S.cat.face = Math.sign(dx);
      if (!adj) { Sfx.bonk(); say('ちかくで しらべよう', 1.0); return; }
      if (i === S.medalCell && !S.medalFound) { pickMedal(i); return; }
      Sfx.sniff(); say(['くんくん… なにもない', 'ここには ないみたい', 'ほこりだけ…'][Math.floor(Math.random() * 3)], 1.2); return;
    }
    if (c.pond) { say('みずは にがて…', 1.2); Sfx.splash(); S.flash = { cell: i, life: 0, col: '120,170,230' }; return; }
    if (!b.safe[S.t][i]) { say('そこは あついにゃ', 1.2); Sfx.sad(); S.flash = { cell: i, life: 0, col: '255,140,60' }; return; }
    const path = HK.pathTo(S.reachPrev, i);
    if (!path) { say('とどかないにゃ', 1.2); Sfx.no(); S.flash = { cell: i, life: 0, col: '150,130,200' }; return; }
    startWalk(path);
  }
  function pickMedal(i) {
    S.medalFound = true;
    if (S.lvIndex >= 0) { save.medals.hidden[S.lvIndex] = 1; persist(); }
    const [x, y] = cellXY(i), px = L.bx + (x + 0.5) * L.s, py = L.by + (y + 0.25) * L.s;
    S.cat.mood = 'happy'; S.cat.moodT = 1.3; S.cat.hop = 1;
    say('メダル みっけ！', 1.5); Sfx.coin(); Sfx.yay();
    for (let k = 0; k < 12; k++) {
      const a = Math.random() * Math.PI * 2, v = 50 + Math.random() * 90;
      S.particles.push({ type: 'star', x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0, max: 0.9 + Math.random() * 0.4, size: L.s * (0.06 + Math.random() * 0.05), rot: Math.random() * 6, col: '#FFCB47' });
    }
    flyMedal(px, py, () => refreshMedals(true));
  }
  function catScreen() { return [L.bx + (S.cat.x + 0.5) * L.s, L.by + (S.cat.y + 0.78) * L.s]; }

  function win() {
    S.won = true; S.winT = 0; S.cat.path = null; S.cat.mood = 'happy';
    if (S.mode === 'play') { Sfx.win(); Music.duck(2.8); }
    const stars = starsFor(S.steps, S.par);
    const [hx, hy] = [L.bx + (S.cat.x + 0.5) * L.s, L.by + (S.cat.y + 0.5) * L.s];
    for (let k = 0; k < 18; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 110;
      S.particles.push({ type: k % 3 ? 'heart' : 'star', x: hx, y: hy - L.s * 0.3, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0, max: 1.2 + Math.random() * 0.6, size: L.s * (0.08 + Math.random() * 0.07), rot: Math.random() * 6, col: ['#FF8FA3', '#FFC94A', '#9FD4F5', '#B8E0A0'][k % 4] });
    }
    if (S.mode !== 'play') return;
    S.newMedal = false;
    if (S.daily) { if (!save.medals.daily[S.daily.key]) { save.medals.daily[S.daily.key] = 1; S.newMedal = true; } }
    else if (!save.medals.clear[S.lvIndex]) { save.medals.clear[S.lvIndex] = 1; S.newMedal = true; }
    S.clearStars = stars;
    if (S.daily) {
      const prev = save.daily[S.daily.key];
      if (!prev || prev.steps > S.steps) save.daily[S.daily.key] = { steps: S.steps, stars, par: S.par, hist: S.history.slice() };
    } else {

  }
  function starsFor(steps, par) { if (steps <= par) return 3; if (steps <= par + Math.max(2, Math.ceil(par * 0.5))) return 2; return 1; }

  // ------------------------------------------------------------------ update
  function update(dt) {
    S.time += dt;
    const b = S.b; if (!b) return;
    const N = b.W * b.H;
    const k = Math.min(1, dt * 11);
    for (let i = 0; i < N; i++) {
      S.shadeA[i] += ((b.shade[S.t][i] ? 1 : 0) - S.shadeA[i]) * k;
      const rt = (S.mode === 'play' && S.reach[i] && !S.cat.path && !S.won && !S.drag) ? 1 : 0;
      S.reachA[i] += (rt - S.reachA[i]) * Math.min(1, dt * 8);
    }
    // sun display
    const target = S.tauDrag !== null ? S.tauDrag : S.t;
    S.tau += (target - S.tau) * Math.min(1, dt * (S.tauDrag !== null ? 22 : 10));
    // cat
    const cat = S.cat;
    if (cat.path && cat.path.length) {
      const nxt = cat.path[0];
      const [tx, ty] = cellXY(nxt);
      const dx = tx - cat.x, dy = ty - cat.y, d = Math.hypot(dx, dy);
      const sp = 6.2 * dt;
      if (dx) cat.face = Math.sign(dx);
      cat.walk += dt * 16;
      if (d <= sp) {
        cat.x = tx; cat.y = ty; cat.cell = nxt; cat.path.shift();
        if (S.mode === 'play') Sfx.step(S.stepN = (S.stepN || 0) + 1);
        if (nxt === b.goal) { win(); }
        else if (!cat.path.length) { cat.path = null; updateReach(); }
      } else { cat.x += dx / d * sp; cat.y += dy / d * sp; }
    }
    if (S.mode === 'play' && !S.won && !cat.path && !S.drag && $('#modal').hidden) {
      S.idleT = (S.idleT || 0) + dt;
      if (S.idleT > (S.idleNext || 22)) {
        S.idleT = 0; S.idleNext = 30 + Math.random() * 20;
        const lines = ['ふぁ〜', 'にゃ〜ん', 'まだかにゃ？'];
        say(lines[Math.floor(Math.random() * lines.length)], 1.4); Sfx.idle();
      }
    } else S.idleT = 0;
    if (cat.moodT > 0) { cat.moodT -= dt; if (cat.moodT <= 0 && !S.won) cat.mood = 'idle'; }
    cat.hop = Math.max(0, cat.hop - dt * 3.5);
    cat.blinkT -= dt; if (cat.blinkT < -0.12) cat.blinkT = 1.8 + Math.random() * 2.5;
    if (S.won) {
      S.winT += dt;
      const q = clamp((S.winT - 0.25) / 0.45, 0, 1);
      cat.scale = 1 - q * 0.75;
      if (S.winT > 0.7) cat.mood = 'gone';
    }
    if (S.mode === 'play' && S.lvIndex === 0 && S.medalCell >= 0 && !S.medalFound && !S.won) {
      S.glintT -= dt;
      if (S.glintT <= 0) { S.glint = 0; S.glintT = 6 + Math.random() * 7; }
    }
    if (S.glint !== null && S.glint !== undefined) { S.glint += dt; if (S.glint > 0.8) S.glint = null; }
    if (S.shopHappy > 0) S.shopHappy -= dt;
    if (S.ouchT > 0) S.ouchT -= dt;
    if (S.sunOuch > 0) S.sunOuch -= dt;
    if (S.bubble) { S.bubble.life += dt; if (S.bubble.life > S.bubble.max) S.bubble = null; }
    if (S.flash) { S.flash.life += dt; if (S.flash.life > 0.6) S.flash = null; }
    // particles
    for (const p of S.particles) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'heart' || p.type === 'star') { p.vy += 140 * dt; p.vx *= 0.98; }
      if (p.type === 'zzz') { p.vx = Math.sin(p.life * 3) * 10; }
    }
    S.particles = S.particles.filter(p => p.life < p.max);
    // heat shimmer on sunny cells
    if (!REDUCED && S.mode !== 'select' && Math.random() < dt * 3) {
      const i = Math.floor(Math.random() * N);
      if (!b.cells[i].block && !b.cells[i].pond && !b.safe[S.t][i]) {
        const [x, y] = cellXY(i);
        S.particles.push({ type: 'heat', x: L.bx + (x + 0.3 + Math.random() * 0.4) * L.s, y: L.by + (y + 0.8) * L.s, vx: 0, vy: -L.s * 0.5, life: 0, max: 1.1, size: L.s * 0.18 });
      }
    }
    if (S.won && S.winT > 0.9 && Math.random() < dt * 1.5) {
      const [gx, gy] = cellXY(b.goal);
      S.particles.push({ type: 'zzz', x: L.bx + (gx + 0.62) * L.s, y: L.by + (gy + 0.25) * L.s, vx: 0, vy: -18, life: 0, max: 1.8, size: L.s * 0.2 });
    }
    // clouds
    for (const cl of S.clouds) { cl.x += cl.v * dt; if (cl.x > 1.25) cl.x = -0.25; }
    if (S.demo) updateDemo(dt);
  }

  // ------------------------------------------------------------------ title demo (autoplay)
  function startDemo() {
    setupBoard(LEVELS[2], 'town', 3);
    S.medalCell = -1;
    S.seedK = 3;
    S.demo = { plan: HK.solve(S.b).plan.slice(), wait: 1.2, sunTo: null, done: 0 };
  }
  function updateDemo(dt) {
    const d = S.demo;
    if (S.won) { d.done += dt; if (d.done > 3.2) { setupBoard(LEVELS[2], 'town', 3); S.demo = { plan: HK.solve(S.b).plan.slice(), wait: 1.0, sunTo: null, done: 0 }; } return; }
    if (S.cat.path) return;
    if (d.sunTo !== null) {
      S.tauDrag = S.tauDrag === null ? S.t : S.tauDrag;
      const dir = Math.sign(d.sunTo - S.tauDrag);
      S.tauDrag += dir * dt * 1.6;
      if ((dir > 0 && S.tauDrag >= d.sunTo) || (dir < 0 && S.tauDrag <= d.sunTo) || dir === 0) S.tauDrag = d.sunTo;
      const nt = Math.round(S.tauDrag);
      while (S.t !== nt) stepTime(Math.sign(nt - S.t), true);
      if (S.tauDrag === d.sunTo) { d.sunTo = null; S.tauDrag = null; d.wait = 0.6; }
      return;
    }
    if (d.wait > 0) { d.wait -= dt; return; }
    const a = d.plan.shift();
    if (!a) return;
    if (a.type === 'walk') { updateReach(); const path = HK.pathTo(S.reachPrev, a.to); if (path) S.cat.path = path.slice(1); d.wait = 0.5; }
    else d.sunTo = a.t;
  }

  // ------------------------------------------------------------------ render
  function skyColors(tau) {
    const K = [
      ['#F4A69B', '#FFE1B8'], ['#8FCBEF', '#E7F4F2'], ['#76C1EE', '#D6EEF9'], ['#69BBEF', '#D0EDFB'],
      ['#76C1EE', '#DAEFF6'], ['#8FC1E6', '#FBE3B9'], ['#8C77BA', '#F8AF86'],
    ];
    const i = clamp(Math.floor(tau), 0, NT - 2), f = clamp(tau - i, 0, 1);
    return [mix(K[i][0], K[i + 1][0], f), mix(K[i][1], K[i + 1][1], f)];
  }

  function drawSky(c) {
    const [top, bot] = skyColors(S.tau);
    const g = c.createLinearGradient(0, 0, 0, L.horizonY);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    c.fillStyle = g; c.fillRect(0, 0, L.w, L.horizonY + 1);
    // clouds
    const w = warmth(S.tau);
    for (const cl of S.clouds) {
      const x = cl.x * L.w, y = L.topR + cl.y * (L.skyH * 0.7), sc = cl.s * clamp(L.skyH / 140, 0.8, 1.4);
      c.fillStyle = w > 0.3 ? `rgba(255,236,236,${0.75})` : 'rgba(255,255,255,.82)';
      c.beginPath();
      c.ellipse(x, y, 26 * sc, 10 * sc, 0, 0, Math.PI * 2);
      c.ellipse(x - 12 * sc, y - 5 * sc, 12 * sc, 10 * sc, 0, 0, Math.PI * 2);
      c.ellipse(x + 6 * sc, y - 9 * sc, 14 * sc, 12 * sc, 0, 0, Math.PI * 2);
      c.fill();
    }
  }

  function drawArc(c) {
    const play = S.mode === 'play';
    c.save();
    // track
    c.setLineDash([2, 7]); c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.75)';
    c.beginPath(); c.ellipse(L.cx, L.cy, L.Rx, L.Ry, 0, -stopAngle(0), -stopAngle(NT - 1)); c.stroke();
    c.setLineDash([]);
    if (play && !S.won) {
      const [lo, hi] = S.drag ? S.drag.range : allowedRange();

        c.lineWidth = 12; c.strokeStyle = 'rgba(255,255,255,.45)';
        c.beginPath(); c.ellipse(L.cx, L.cy, L.Rx, L.Ry, 0, -stopAngle(lo), -stopAngle(hi)); c.stroke();
      }

        c.lineWidth = 2; c.strokeStyle = INK;

        if (!ok) { c.beginPath(); c.moveTo(x - 2.3, y - 2.3); c.lineTo(x + 2.3, y + 2.3); c.moveTo(x + 2.3, y - 2.3); c.lineTo(x - 2.3, y + 2.3); c.lineWidth = 1.6; c.stroke(); }
      }
    } else {
      for (let i = 0; i < NT; i++) { const [x, y] = sunPos(i); ell(c, x, y, 3.5, 3.5); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill(); }
    }
    c.restore();
  }

  function drawSkyline(c) {
    const hy = L.horizonY, key = S.themeKey, dusk = warmth(S.tau);
    c.save();
    if (key === 'town') {
      const cols = [mix('#EBCFE0', '#C9A9CF', dusk), mix('#DCCBEC', '#B7A3D6', dusk)];
      for (const it of S.sky.items) {
        c.fillStyle = cols[it.col];
        c.beginPath();
        c.rect(it.x, hy - it.h, it.w, it.h + 2);
        if (it.roof) { c.moveTo(it.x - 2, hy - it.h); c.lineTo(it.x + it.w / 2, hy - it.h - it.w * 0.42); c.lineTo(it.x + it.w + 2, hy - it.h); }
        c.fill();
        if (dusk > 0.35 && it.win > 0.4) { c.fillStyle = `rgba(255,226,140,${dusk})`; c.fillRect(it.x + it.w * 0.3, hy - it.h * 0.7, 4, 4); }
      }
    } else if (key === 'park') {

    } else {

      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.lineCap = 'round';
      for (let x = 12; x < L.w; x += 46) { const o = Math.sin(S.time * 1.4 + x) * 3; c.beginPath(); c.moveTo(x + o, hy - 8); c.quadraticCurveTo(x + 6 + o, hy - 12, x + 12 + o, hy - 8); c.stroke(); }
      const bx = it => it.boat;

      c.fillStyle = '#FFFFFF'; c.beginPath(); c.moveTo(bxp, hy - 16); c.lineTo(bxp, hy - 38); c.lineTo(bxp + 14, hy - 16); c.closePath(); c.fill();
      c.fillStyle = '#EF6F61'; c.beginPath(); c.moveTo(bxp - 10, hy - 16); c.lineTo(bxp + 18, hy - 16); c.lineTo(bxp + 13, hy - 10); c.lineTo(bxp - 6, hy - 10); c.closePath(); c.fill();
    }
    c.restore();
  }

  function drawFarGround(c) {

  function drawBoard(c) {
    const { bx, by, bw, bh, s, depth } = L;
    const b = S.b, th = S.theme;
    const rad = Math.max(8, s * 0.26);
    c.save();
    c.fillStyle = 'rgba(70,50,30,.16)'; rr(c, bx - 5, by + depth + 5, bw + 10, bh + 4, rad + 4); c.fill();
    c.lineWidth = 2.5; c.strokeStyle = INK;
    rr(c, bx, by + depth, bw, bh, rad); c.fillStyle = th.side; c.fill(); c.stroke();
    rr(c, bx, by, bw, bh, rad); c.save(); c.clip();
    for (let y = 0; y < b.H; y++) for (let x = 0; x < b.W; x++) {
      c.fillStyle = (x + y) % 2 ? th.tileB : th.tileA;
      c.fillRect(Math.floor(bx + x * s), Math.floor(by + y * s), Math.ceil(s) + 1, Math.ceil(s) + 1);
    }
    c.strokeStyle = th.grout; c.lineWidth = 1;
    c.beginPath();
    for (let x = 1; x < b.W; x++) { c.moveTo(bx + x * s, by); c.lineTo(bx + x * s, by + bh); }
    for (let y = 1; y < b.H; y++) { c.moveTo(bx, by + y * s); c.lineTo(bx + bw, by + y * s); }
    c.stroke();
    // ground decor
    for (const d of S.decor) {
      const [x, y] = cellXY(d.i); const px = bx + (x + d.dx) * s, py = by + (y + d.dy) * s;
      if (S.themeKey === 'park') {
        if (d.k === 0) { c.fillStyle = '#FFFFFF'; for (let q = 0; q < 5; q++) { const a = q * 1.256; ell(c, px + Math.cos(a) * s * 0.035, py + Math.sin(a) * s * 0.035, s * 0.028, s * 0.028); c.fill(); } c.fillStyle = '#FFD166'; ell(c, px, py, s * 0.022, s * 0.022); c.fill(); }
        else { c.strokeStyle = 'rgba(80,140,60,.45)'; c.lineWidth = Math.max(1, s * 0.03); c.lineCap = 'round'; c.beginPath(); c.moveTo(px - s * 0.05, py); c.lineTo(px - s * 0.03, py - s * 0.08); c.moveTo(px, py); c.lineTo(px, py - s * 0.1); c.moveTo(px + s * 0.05, py); c.lineTo(px + s * 0.03, py - s * 0.08); c.stroke(); }
      } else if (S.themeKey === 'beach') {
        if (d.k === 0) { c.fillStyle = '#FFB5A7'; c.beginPath(); c.arc(px, py, s * 0.05, Math.PI, 0); c.closePath(); c.fill(); }
        else if (d.k === 1) { c.fillStyle = 'rgba(190,150,90,.35)'; ell(c, px, py, s * 0.02, s * 0.015); c.fill(); ell(c, px + s * 0.07, py + s * 0.04, s * 0.015, s * 0.012); c.fill(); }
      } else {
        if (d.k === 0) { c.fillStyle = 'rgba(150,120,80,.2)'; ell(c, px, py, s * 0.04, s * 0.028); c.fill(); }
        else if (d.k === 1 && d.r < 0.3) { c.fillStyle = '#FF9CB5'; for (let q = 0; q < 4; q++) { const a = q * 1.57 + 0.4; ell(c, px + Math.cos(a) * s * 0.03, py + Math.sin(a) * s * 0.03, s * 0.024, s * 0.024); c.fill(); } }
      }
    }
    // ponds
    for (let i = 0; i < b.W * b.H; i++) {
      if (!b.cells[i].pond) continue;
      const [x, y] = cellXY(i);
      const m = (xx, yy) => xx >= 0 && yy >= 0 && xx < b.W && yy < b.H && b.cells[yy * b.W + xx].pond;
      const up = m(x, y - 1), dn = m(x, y + 1), lf = m(x - 1, y), rt = m(x + 1, y);
      const r = s * 0.38, ins = s * 0.06;
      const px = bx + x * s + (lf ? -1 : ins), py = by + y * s + (up ? -1 : ins);
      const pw = s + (lf ? 1 : -ins) + (rt ? 1 : -ins), ph = s + (up ? 1 : -ins) + (dn ? 1 : -ins);
      rr(c, px, py, pw, ph, [!up && !lf ? r : 0, !up && !rt ? r : 0, !dn && !rt ? r : 0, !dn && !lf ? r : 0]);
      c.fillStyle = '#8FD0F0'; c.fill();
    }
    for (let i = 0; i < b.W * b.H; i++) {
      if (!b.cells[i].pond) continue;
      const [x, y] = cellXY(i);
      const cx = bx + (x + 0.5) * s, cy = by + (y + 0.5) * s;
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = Math.max(1.2, s * 0.03); c.lineCap = 'round';
      const o = Math.sin(S.time * 1.5 + i) * s * 0.03;
      c.beginPath(); c.moveTo(cx - s * 0.2 + o, cy - s * 0.12); c.quadraticCurveTo(cx - s * 0.1 + o, cy - s * 0.18, cx + o, cy - s * 0.12); c.stroke();

    return r ? `${m}/${d} クリア ${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}` : `${m}/${d} のステージ`;
  }

  const MEDAL_SVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9.5 1.5h4.6l3 8.5h-4.6z" fill="#6EB5E0" stroke="#5B4637" stroke-width="1.6" stroke-linejoin="round"/><path d="M22.5 1.5h-4.6l-3 8.5h4.6z" fill="#EE6B5F" stroke="#5B4637" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="19.5" r="11" fill="#FFCB47" stroke="#5B4637" stroke-width="2.2"/><circle cx="16" cy="19.5" r="7.6" fill="none" stroke="#E9A43A" stroke-width="1.6"/><g fill="#C9892E"><ellipse cx="16" cy="21.8" rx="3.2" ry="2.6"/><circle cx="12.4" cy="18" r="1.3"/><circle cx="14.9" cy="16.1" r="1.3"/><circle cx="17.5" cy="16.1" r="1.3"/><circle cx="19.8" cy="18" r="1.3"/></g></svg>';
  function refreshMedals(bump) {
    $('#medalCount').textContent = medalCounts().total;
    if (bump) { const el = $('#medalChip'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    if (S.mode === 'select' && S.selTab === 'shop') renderShop();
  }
  function flyMedal(x, y, done) {
    const app = $('#app').getBoundingClientRect(), r = cv.getBoundingClientRect(), chip = $('#medalChip').getBoundingClientRect();
    const d = document.createElement('div'); d.className = 'fly-medal'; d.innerHTML = MEDAL_SVG;
    const sx = r.left - app.left + x - 20, sy = r.top - app.top + y - 20;
    d.style.left = sx + 'px'; d.style.top = sy + 'px';
    $('#app').appendChild(d);
    requestAnimationFrame(() => {
      d.classList.add('pop');
      setTimeout(() => { d.classList.add('go'); d.style.transform = `translate(${chip.left - app.left + 4 - sx}px, ${chip.top - app.top + 2 - sy}px) scale(.75)`; }, 480);
      setTimeout(() => { d.remove(); if (done) done(); }, 1250);
    });
  }

  function showMedals() {
    Sfx.tap();
    const m = $('#modal'), mc = medalCounts(), used = !!save.medals.ad[todayKey()], nx = nextUnlock(mc.total);
    m.innerHTML = `<div class="card medal-card" role="dialog" aria-label="メダル">
      <div class="medal-big">${MEDAL_SVG}<b>${mc.total}</b><span>まい</span></div>
      <ul class="medal-list">
        <li><span>ステージクリア</span><b>${mc.clear} / ${LEVELS.length}</b></li>
        <li><span>かくしメダル</span><b>${mc.hidden} / ${LEVELS.length}</b></li>
        <li><span>きょうのおさんぽ</span><b>${mc.daily}</b></li>
        <li><span>どうがボーナス</span><b>${mc.ad}</b></li>
      </ul>
      <p class="note">かくしメダルは どのステージにも 1まい。ねこが ものの となりに いるときに、その ものを タップして しらべよう。</p>
      ${nx ? `<p class="note next-unlock">つぎの ごほうび「${nx.name}」まで あと <b>${nx.need - mc.total}</b> まい</p>` : ''}
      <div class="actions col">
        <button class="btn primary" id="adBtn" ${used ? 'disabled' : ''}>${used ? 'きょうの どうがボーナスは もらったよ' : '▶ どうがを見て メダル +' + AD_REWARD}</button>
        <button class="btn" id="medalClose">とじる</button>
      </div>
    </div>`;
    m.hidden = false;
    $('#medalClose').addEventListener('click', () => { Sfx.tap(); closeMedals(); });
    if (!used) { Ads.prepare(); $('#adBtn').addEventListener('click', () => { Sfx.tap(); Ads.show(); }); }
  }
  function closeMedals() {
    const m = $('#modal'); m.hidden = true;
    if (S.mode === 'play' && S.won && S.clearStars) showClear(S.clearStars, true);
  }
  function grantAd() {
    const k = todayKey();
    if (save.medals.ad[k]) return;
    save.medals.ad[k] = AD_REWARD; persist();
    Sfx.grant(AD_REWARD); refreshMedals(true);
    toast(`メダル +${AD_REWARD}！ ありがとう`);
    if (!$('#modal').hidden && $('#modal').querySelector('.medal-card')) showMedals();
  }

  // Rewarded ads: Google H5 Games Ads (Ad Placement API). Until the account is approved for it,
  // no ad arrives and the promo video plays instead.
  const Ads = (() => {
    let showFn = null, asking = false;
    function init() {
      window.adsbygoogle = window.adsbygoogle || [];
      window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
      try {
        const sc = document.createElement('script');
        sc.async = true; sc.crossOrigin = 'anonymous';
        sc.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + AD_CLIENT;
        sc.setAttribute('data-ad-frequency-hint', '30s');
        if (/[?&]adtest=1/.test(location.search)) sc.setAttribute('data-adbreak-test', 'on');
        document.head.appendChild(sc);
        window.adConfig({ preloadAdBreaks: 'on', sound: 'on' });
      } catch (e) { /* ads unavailable */ }
    }
    function prepare() {
      if (asking || showFn) return;
      asking = true;
      try {
        window.adBreak({
          type: 'reward', name: 'daily_medals',
          beforeAd() { try { if (Snd.ac) Snd.ac.suspend(); } catch (e) { /* ignore */ } },
          afterAd() { try { if (Snd.ac) Snd.ac.resume(); } catch (e) { /* ignore */ } },
          beforeReward(fn) { showFn = fn; },
          adDismissed() { toast('さいごまで 見ると メダルが もらえるよ'); },
          adViewed() { grantAd(); },
          adBreakDone() { asking = false; },
        });
      } catch (e) { asking = false; }
    }
    function show() {
      if (save.medals.ad[todayKey()]) return;
      if (showFn) { const fn = showFn; showFn = null; try { fn(); return; } catch (e) { /* fall back */ } }
      Promo.open();
    }
    return { init, prepare, show };
  })();
  const Promo = {
    wasMusic: false,
    open() {
      const v = $('#adVideo');
      $('#adLayer').hidden = false;
      $('#adMsg').textContent = `さいごまで 見ると メダル +${AD_REWARD}`;
      this.wasMusic = Music.on; if (this.wasMusic) Music.stop();
      v.src = 'pv.mp4'; v.controls = false;
      v.onended = () => { this.close(); grantAd(); };
      v.onerror = () => { $('#adMsg').textContent = 'どうがを よみこめませんでした。あとで もういちど ためしてね'; };
      try { const pr = v.play(); if (pr && pr.catch) pr.catch(() => { v.controls = true; $('#adMsg').textContent = '▶ を おして さいせいしてね'; }); } catch (e) { v.controls = true; }
    },
    close() {
      const v = $('#adVideo'); try { v.pause(); } catch (e) { /* ignore */ }
      $('#adLayer').hidden = true;
      if (this.wasMusic && save.music) Music.start();
    },
  };

  function renderTabs() {
    $('#tabStage').setAttribute('aria-selected', String(S.selTab === 'stage'));
    $('#tabShop').setAttribute('aria-selected', String(S.selTab === 'shop'));
    if (S.selTab === 'shop') renderShop(); else renderStages();
  }
  function buildSelect() { S.selTab = S.selTab || 'stage'; renderTabs(); refreshSound(); refreshMedals(); }
  function renderStages() {
    const host = $('#worlds'); host.innerHTML = '';
    const tot = document.createElement('div'); tot.className = 'stars-total';
    tot.innerHTML = `${STAR_SVG(true)}<span>あつめた ほし <b>${totalStars()}</b> / ${LEVELS.length * 3}</span>`;
    host.appendChild(tot);
    const daily = document.createElement('button');
    daily.className = 'daily-card'; daily.id = 'dailyCard';
    daily.innerHTML = `<div><b>きょうのおさんぽ</b><span>${dailyStatus()}・まいにち かわるよ</span></div><span class="go">あそぶ</span>`;
    daily.addEventListener('click', () => startDaily());
    host.appendChild(daily);
    let firstOpen = -1;
    for (let i = 0; i < LEVELS.length; i++) if (unlocked(i) && !save.stars[i]) { firstOpen = i; break; }
    WORLDS.forEach((w, wi) => {
      const sec = document.createElement('section'); sec.className = 'world w-' + w.key;
      let st = 0; for (let i = wi * 10; i < wi * 10 + 10; i++) st += save.stars[i] || 0;
      sec.innerHTML = `<h3>${w.name}<small>${w.sub}・★${st}/30</small></h3>`;
      const grid = document.createElement('div'); grid.className = 'grid';
      for (let i = wi * 10; i < wi * 10 + 10; i++) {
        const b = document.createElement('button');
        const open = unlocked(i);
        b.className = 'lv' + (open ? '' : ' locked') + (i === firstOpen ? ' next' : '');
        b.id = 'lv' + (i + 1);
        if (open) {
          const sv = save.stars[i] || 0, hm = !!save.medals.hidden[i];
          b.innerHTML = `<span>${i + 1}</span><span class="st">${[0, 1, 2].map(k => STAR_SVG(k < sv)).join('')}</span>${hm ? `<span class="hm" title="かくしメダル">${MEDAL_SVG}</span>` : ''}`;
          b.setAttribute('aria-label', `ステージ${i + 1} ${NAMES[i]} ほし${sv}${hm ? ' かくしメダル あり' : ''}`);
          b.addEventListener('click', () => startLevel(i));
        } else {
          b.innerHTML = LOCK_SVG; b.setAttribute('aria-label', `ステージ${i + 1} まだ あそべません`);
          b.addEventListener('click', () => { Sfx.no(); toast('ひとつ前のステージを クリアしよう'); });
        }
        grid.appendChild(b);
      }
      sec.appendChild(grid);
      host.appendChild(sec);
    });
  }
  const SHOP_TABS = [['outfit', 'きせかえ'], ['pattern', 'もよう'], ['voice', 'こえ']];
  function lookName() {
    const nm = (k, id) => (SHOP[k].find(x => x.id === id) || SHOP[k][0]).name;
    return `${nm('pattern', save.equip.pattern)}・${nm('outfit', save.equip.outfit)}・こえ「${nm('voice', save.equip.voice)}」`;
  }
  function renderShop() {
    const host = $('#worlds'), keepScroll = host.scrollTop;
    host.innerHTML = '';
    const mc = medalCounts(), cat = S.shopCat || 'outfit';
    const top = document.createElement('div'); top.className = 'shop-top';
    top.innerHTML = `<canvas id="shopCat" width="240" height="240" aria-label="いまの ねこ"></canvas>
      <div class="shop-info"><b>いまの ねこ</b><span class="now">${lookName()}</span>
      <span class="have">${MEDAL_SVG}<b>${mc.total}</b> まい もってる</span>
      <button class="btn" id="hearBtn">こえを きく</button></div>`;
    host.appendChild(top);
    const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'tablist');
    for (const [k, label] of SHOP_TABS) {
      const b = document.createElement('button'); b.className = 'seg-btn'; b.setAttribute('role', 'tab'); b.textContent = label;
      b.setAttribute('aria-selected', String(cat === k));
      b.addEventListener('click', () => { Sfx.tap(); S.shopCat = k; renderShop(); });
      seg.appendChild(b);
    }
    host.appendChild(seg);
    const grid = document.createElement('div'); grid.className = 'shop-grid';
    for (const it of SHOP[cat]) {
      const open = mc.total >= it.need, on = save.equip[cat] === it.id;
      const b = document.createElement('button');
      b.className = 'item' + (open ? '' : ' locked') + (on ? ' on' : '');
      if (cat === 'voice') {
        const pic = document.createElement('div'); pic.className = 'voice-pic'; pic.innerHTML = SOUND_ON; b.appendChild(pic);
      } else {
        const pic = document.createElement('canvas'); pic.width = 128; pic.height = 128;
        const c2 = pic.getContext('2d'); c2.scale(2, 2);
        drawCat(c2, 32, 60, 54, { face: 1, t: 0.4, look: Object.assign({}, save.equip, { [cat]: it.id }) });
        b.appendChild(pic);
      }
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.name; b.appendChild(nm);
      const st = document.createElement('span'); st.className = 'state';
      st.innerHTML = on ? 'つかってる' : open ? 'つかう' : `${LOCK_SVG}<span>${it.need}まい</span>`;
      b.appendChild(st);
      b.setAttribute('aria-label', `${it.name}：${on ? 'つかっている' : open ? 'つかえる' : `メダル${it.need}まいで かいほう`}`);
      b.addEventListener('click', () => {
        if (cat === 'voice') Sfx.hear(it.id);
        if (!open) { if (cat !== 'voice') Sfx.no(); toast(`メダルが ${it.need}まい あつまると つかえるよ（いま ${mc.total}まい）`); return; }
        save.equip[cat] = it.id; persist(); S.shopHappy = 1.2;
        if (cat !== 'voice') { Sfx.tap(); Sfx.meowWith(); }
        renderShop();
      });
      grid.appendChild(b);
    }
    host.appendChild(grid);
    const nx = nextUnlock(mc.total);
    const tipP = document.createElement('p'); tipP.className = 'shop-note';
    tipP.innerHTML = nx ? `つぎの ごほうび「${nx.name}」まで あと <b>${nx.need - mc.total}</b> まい。メダルは ステージクリア・かくしメダル・どうがボーナスで ふえるよ。` : 'ぜんぶ そろったよ！';
    host.appendChild(tipP);
    $('#hearBtn').addEventListener('click', () => { Sfx.hear(); S.shopHappy = 1.2; });
    host.scrollTop = keepScroll;
  }
  function drawShopCat() {
    const cvs = document.getElementById('shopCat'); if (!cvs) return;
    const c2 = cvs.getContext('2d'); c2.setTransform(2, 0, 0, 2, 0, 0); c2.clearRect(0, 0, 120, 120);
    c2.fillStyle = 'rgba(255,255,255,.7)'; ell(c2, 60, 104, 38, 8); c2.fill();
    drawCat(c2, 60, 104, 96, { face: 1, t: S.time, blink: (S.time % 3.4) > 3.25, mood: S.shopHappy > 0 ? 'happy' : 'idle', look: save.equip });
  }

  function showTitle() {
    S.daily = null; S.lvIndex = -1;
    $('#modal').hidden = true;
    startDemo();
    setMode('title');
  }
  function showSelect() {
    $('#modal').hidden = true;
    if (S.mode === 'play' || !S.demo) startDemo();
    buildSelect();
    setMode('select');
    const nxt = document.querySelector('.lv.next');
    if (nxt) setTimeout(() => nxt.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
  }
  function startLevel(i) {
    Sfx.enter();
    S.clearStars = 0;
    S.demo = null; S.daily = null; S.lvIndex = i; S.seedK = i + 1;
    const world = WORLDS[Math.floor(i / 10)];
    setupBoard(LEVELS[i], world.key, i + 1);
    $('#stageNum').textContent = `${Math.floor(i / 10) + 1}-${(i % 10) + 1}`;
    $('#stageName').textContent = NAMES[i];
    enterPlay(TIPS[i], i <= 1);
  }
  function startDaily() {
    Sfx.enter();
    S.clearStars = 0;
    const key = todayKey();
    const d = makeDaily(key);
    S.demo = null; S.lvIndex = -1; S.daily = { key, label: d.label }; S.seedK = 900 + (hash(key.length, Number(key.replace(/-/g, '')), 1) % 1000);
    setupBoard(d.lv, d.theme, S.seedK);
    $('#stageNum').textContent = d.label;
    $('#stageName').textContent = 'きょうのおさんぽ';
    enterPlay(save.tips.daily ? null : 'まいにち かわる ステージ。クリアしたら けっかを シェアしよう。', false);
    save.tips.daily = 1; persist();
  }
  function enterPlay(tip, autoHint) {
    $('#modal').hidden = true;
    const tipEl = $('#tip');
    if (tip) {
      tipEl.innerHTML = '';
      const icon = document.createElement('canvas');
      const isz = 40; icon.width = isz * 2; icon.height = isz * 2; icon.style.width = icon.style.height = isz + 'px';
      const ic = icon.getContext('2d'); ic.scale(2, 2); drawCat(ic, isz / 2, isz * 0.98, isz * 0.9, { face: 1, t: 0, mood: 'happy' });
      const p = document.createElement('p'); p.textContent = tip;
      tipEl.appendChild(icon); tipEl.appendChild(p);
      tipEl.hidden = false;
    } else tipEl.hidden = true;
    S.tipAction = S.lvIndex === 1 ? 'sun' : 'walk';
    setMode('play');
    updateHud();
    if (autoHint) setTimeout(() => { if (S.mode === 'play' && !S.undo.length) doHintSilent(); }, 700);
  }
  function doHintSilent() { const snd = save.sound; save.sound = false; doHint(); save.sound = snd; }
  function dismissTip(kind) {
    const tipEl = $('#tip');
    if (tipEl.hidden) return;
    if (S.lvIndex === 1 && kind !== 'sun') return;
    if (S.lvIndex === 2 && kind !== 'sun') return;
    tipEl.hidden = true;
    computeLayout();
  }
  $('#tip').addEventListener('click', () => { $('#tip').hidden = true; computeLayout(); });

  function updateHud() {
    $('#stepCount').textContent = S.steps;
    $('#parCount').textContent = S.par;
    $('#undoBtn').disabled = !S.undo.length;
  }

  function shareText() {
    const r = save.daily[S.daily.key];
    const hist = (r && r.hist) || S.history;
    const st = r ? r.stars : starsFor(S.steps, S.par);
    const steps = r ? r.steps : S.steps;
    const turns = [hist[0]];
    for (let i = 1; i < hist.length; i++) {
      const prev = turns[turns.length - 1];
      if (hist[i] === prev) continue;
      if (turns.length >= 2 && Math.sign(prev - turns[turns.length - 2]) === Math.sign(hist[i] - prev)) { turns[turns.length - 1] = hist[i]; continue; }
      turns.push(hist[i]);
    }
    const seq = turns.map(t => HOUR_EMOJI[t]).join('→');
    return `ひかげねこ きょうのおさんぽ ${S.daily.label}\n${'★'.repeat(st)}${'☆'.repeat(3 - st)} おひさま${steps}回（めやす${S.par}回）\n${seq}`;
  }

  function showClear(stars, quiet) {
    const m = $('#modal');
    const isDaily = !!S.daily;
    const last = !isDaily && S.lvIndex === LEVELS.length - 1;
    const worldEnd = !isDaily && S.lvIndex % 10 === 9;
    const note = stars === 3 ? 'めやすどおり！ かんぺきな おさんぽ。' : `めやすは ${S.par}回。もっと へらせるかも？`;
    let title = 'おさんぽ せいこう！';
    if (last) title = 'ぜんステージ クリア！';
    else if (worldEnd) title = `${WORLDS[Math.floor(S.lvIndex / 10)].name} クリア！`;
    m.innerHTML = `<div class="card" role="dialog" aria-label="${title}">
      <h2>${title}</h2>
      <div class="stars">${[0, 1, 2].map(k => STAR_SVG(k < stars)).join('')}</div>
      <p class="stat">おひさまを うごかした回数 <b>${S.steps}</b> 回<br><span class="note">${note}</span></p>
      <div class="medal-lines">${S.newMedal ? `<span class="medal-get">${MEDAL_SVG}<b>${isDaily ? 'きょうのおさんぽ' : 'クリア'} メダル +1</b></span>` : ''}${isDaily ? '' : `<span class="hidden-status">かくしメダル：${S.medalFound ? '<b>みつけた！</b>' : 'まだ みつけていない'}</span>`}</div>
      ${isDaily ? `<pre class="share-box" id="shareBox"></pre>` : ''}
      <div class="actions" id="clearActions"></div>
    </div>`;
    const act = $('#clearActions');
    const mk = (label, cls, fn, id) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.id = id; b.addEventListener('click', fn); act.appendChild(b); return b; };
    if (isDaily) {
      $('#shareBox').textContent = shareText();
      mk('けっかをコピー', 'primary', () => copyShare(), 'copyBtn');
      mk('もういちど', '', () => { Sfx.tap(); m.hidden = true; setupBoard(S.lv, S.themeKey, S.seedK); updateHud(); }, 'retryBtn');
      mk('もどる', '', () => { Sfx.tap(); showSelect(); }, 'toSelect');
    } else {
      mk('もういちど', '', () => { Sfx.tap(); m.hidden = true; setupBoard(S.lv, S.themeKey, S.seedK); updateHud(); }, 'retryBtn');
      mk('ステージ', '', () => { Sfx.tap(); showSelect(); }, 'toSelect');
      if (!last) mk('つぎへ', 'primary', () => startLevel(S.lvIndex + 1), 'nextBtn');
    }
    m.hidden = false;
    if (!quiet) {
      for (let k = 0; k < 3; k++) Sfx.star(k, k < stars, 0.28 + k * 0.15);
      if (S.newMedal) setTimeout(() => { refreshMedals(true); Sfx.coin(); }, 900);
    } else { m.querySelectorAll('.card, .stars svg').forEach(el => { el.style.animation = 'none'; }); }
    const primary = act.querySelector('.primary'); if (primary) primary.focus({ preventScroll: true });
  }
  function copyShare() {
    const text = shareText();
    const fallback = () => { const box = $('#shareBox'); const r = document.createRange(); r.selectNodeContents(box); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('テキストを えらんだよ。コピーしてね'); };
    try {
      navigator.clipboard.writeText(text).then(() => toast('コピーしました'), fallback);
    } catch (e) { fallback(); }
    Sfx.tap();
  }

  // ------------------------------------------------------------------ wiring
  $('#playBtn').addEventListener('click', () => { Sfx.unlock(); Sfx.start(); showSelect(); });
  $('#soundBtnTitle').addEventListener('click', () => { Sfx.unlock(); toggleSound(); });
  $('#musicBtnTitle').addEventListener('click', () => { toggleMusic(); });
  $('#selectBack').addEventListener('click', () => { Sfx.swish(); showTitle(); });
  $('#backBtn').addEventListener('click', () => { Sfx.swish(); showSelect(); });
  $('#undoBtn').addEventListener('click', doUndo);
  $('#medalChip').addEventListener('click', () => { Sfx.unlock(); showMedals(); });
  $('#tabStage').addEventListener('click', () => { if (S.selTab === 'stage') return; Sfx.tap(); S.selTab = 'stage'; $('#worlds').scrollTop = 0; renderTabs(); });
  $('#tabShop').addEventListener('click', () => { if (S.selTab === 'shop') return; Sfx.tap(); S.selTab = 'shop'; $('#worlds').scrollTop = 0; renderTabs(); });
  $('#musicBtnSelect').addEventListener('click', toggleMusic);
  $('#soundBtnSelect').addEventListener('click', toggleSound);
  $('#adClose').addEventListener('click', () => { Promo.close(); toast('さいごまで 見ると メダルが もらえるよ'); });
  $('#hintBtn').addEventListener('click', doHint);
  $('#resetBtn').addEventListener('click', doReset);
  window.addEventListener('resize', resize);
  refreshSound();


  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    render();
    if (S.mode === 'select' && S.selTab === 'shop') drawShopCat();
    requestAnimationFrame(frame);
  }
  Ads.init();
  $('#medalChip .mi').innerHTML = MEDAL_SVG;
  refreshMedals();
  startDemo();
  resize();
  setMode('title');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => computeLayout());
  requestAnimationFrame(frame);
})();

</script>
</body>
